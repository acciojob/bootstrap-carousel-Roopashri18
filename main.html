<html>
<head>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
</head>
<body>
    <!-- Write your code here -->
    <div class="slide">
    <div class="carousel slide" id="myCarousel" data-ride="carousel">

        <div class="carousel-inner" role="listbox">

            <div class="item">
                <img class="first-slide" style="width:100%;"
                     alt="First slide"
                     src="data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='900' height='400'%3E%3Crect width='100%25' height='100%25' fill='%23777'/%3E%3Ctext x='50%25' y='50%25' fill='%23555' font-size='48' font-family='Arial' text-anchor='middle' dy='.3em'%3EFirst slide%3C/text%3E%3C/svg%3E">
            </div>

            <div class="item">
                <img class="second-slide" style="width:100%;"
                     alt="Second slide"
                     src="data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='900' height='400'%3E%3Crect width='100%25' height='100%25' fill='%23666'/%3E%3Ctext x='50%25' y='50%25' fill='%23444' font-size='48' font-family='Arial' text-anchor='middle' dy='.3em'%3ESecond slide%3C/text%3E%3C/svg%3E">
            </div>

            <div class="item active">
                <img class="third-slide" style="width:100%;"
                     alt="Third slide"
                     src="data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='900' height='400'%3E%3Crect width='100%25' height='100%25' fill='%23555'/%3E%3Ctext x='50%25' y='50%25' fill='%23333' font-size='48' font-family='Arial' text-anchor='middle' dy='.3em'%3EThird slide%3C/text%3E%3C/svg%3E">
            </div>

            <div class="item">
                <img class="fourth-slide" style="width:100%;"
                     alt="Fourth slide"
                     src="data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='900' height='400'%3E%3Crect width='100%25' height='100%25' fill='%23666'/%3E%3Ctext x='50%25' y='50%25' fill='%23444' font-size='48' font-family='Arial' text-anchor='middle' dy='.3em'%3EFourth slide%3C/text%3E%3C/svg%3E">
            </div>

            <div class="item">
                <img class="fifth-slide" style="width:100%;"
                     alt="Fifth slide"
                     src="data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='900' height='400'%3E%3Crect width='100%25' height='100%25' fill='%23777'/%3E%3Ctext x='50%25' y='50%25' fill='%23555' font-size='48' font-family='Arial' text-anchor='middle' dy='.3em'%3EFifth slide%3C/text%3E%3C/svg%3E">
            </div>

        </div>

        <a class="left carousel-control" href="#myCarousel" role="button" data-slide="prev">
            <span class="glyphicon glyphicon-chevron-left" aria-hidden="true"></span>
            <span class="sr-only">Previous</span>
        </a>
        <a class="right carousel-control" href="#myCarousel" role="button" data-slide="next">
            <span class="glyphicon glyphicon-chevron-right" aria-hidden="true"></span>
            <span class="sr-only">Next</span>
        </a>

    </div>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script>window.jQuery || document.write('<script src="https://code.jquery.com/jquery-3.6.0.min.js"><\/script>')</script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <script>
        (function () {
            var carousel = document.getElementById('myCarousel');
            var controls = carousel.querySelectorAll('.carousel-control');

            if (window.jQuery && jQuery.fn.carousel) {
                jQuery('#myCarousel').carousel({ interval: 5000 });
            }

            function go(direction) {
                // Use Bootstrap's animated slide when it is available
                if (window.jQuery && jQuery.fn.carousel) {
                    jQuery('#myCarousel').carousel(direction < 0 ? 'prev' : 'next');
                    return;
                }
                // Plain-JS fallback: move the "active" class between slides
                var items = carousel.querySelectorAll('.item');
                var current = 0;
                for (var i = 0; i < items.length; i++) {
                    if (items[i].classList.contains('active')) { current = i; }
                    items[i].classList.remove('active');
                }
                items[(current + direction + items.length) % items.length].classList.add('active');
            }

            for (var i = 0; i < controls.length; i++) {
                controls[i].addEventListener('click', function (e) {
                    e.preventDefault();
                    e.stopPropagation(); // stops Bootstrap's own handler from also firing
                    go(this.classList.contains('left') ? -1 : 1);
                });
            }
        })();
    </script>
</body>

</html>
