    <!-- Bootstrap Bundle with Popper -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script>window.jQuery || document.write('<script src="https://code.jquery.com/jquery-3.6.0.min.js"><\/script>')</script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <script>
        (function () {
            var carousel = document.getElementById('myCarousel');
            var controls = carousel.querySelectorAll('.carousel-control');

            if (window.jQuery && jQuery.fn.carousel) {
                jQuery('#myCarousel').carousel({ interval: 5000 });
            }

            function go(direction) {
                // Use Bootstrap's animated slide when it is available
                if (window.jQuery && jQuery.fn.carousel) {
                    jQuery('#myCarousel').carousel(direction < 0 ? 'prev' : 'next');
                    return;
                }
                // Plain-JS fallback: move the "active" class between slides
                var items = carousel.querySelectorAll('.item');
                var current = 0;
                for (var i = 0; i < items.length; i++) {
                    if (items[i].classList.contains('active')) { current = i; }
                    items[i].classList.remove('active');
                }
                items[(current + direction + items.length) % items.length].classList.add('active');
            }

            for (var i = 0; i < controls.length; i++) {
                controls[i].addEventListener('click', function (e) {
                    e.preventDefault();
                    e.stopPropagation(); // stops Bootstrap's own handler from also firing
                    go(this.classList.contains('left') ? -1 : 1);
                });
            }
        })();
    </script>
</body>

</html>
